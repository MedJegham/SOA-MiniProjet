version: '3.8'

services:

  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: platforma-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: platforma-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ============================================================
  # MICROSERVICES
  # ============================================================

  auth-service:
    build:
      context: ./platforma
      dockerfile: services/auth-service/Dockerfile
    container_name: platforma-auth
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      AUTH_GRPC_PORT: 50051
      JWT_SECRET: ${JWT_SECRET:-platforma-secret-change-in-prod}
      KAFKA_BROKER: kafka:9092
      AUTH_DB_PATH: /app/data/auth.db
    volumes:
      - auth-data:/app/data
    expose:
      - "50051"
    restart: unless-stopped

  booking-service:
    build:
      context: ./platforma
      dockerfile: services/booking-service/Dockerfile
    container_name: platforma-booking
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOKING_GRPC_PORT: 50052
      KAFKA_BROKER: kafka:9092
      BOOKING_DB_PATH: /app/data/booking.db
    volumes:
      - booking-data:/app/data
    expose:
      - "50052"
    restart: unless-stopped

  payment-service:
    build:
      context: ./platforma
      dockerfile: services/payment-service/Dockerfile
    container_name: platforma-payment
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      PAYMENT_GRPC_PORT: 50053
      KAFKA_BROKER: kafka:9092
      PAYMENT_DB_PATH: /app/data/payment.db
    volumes:
      - payment-data:/app/data
    expose:
      - "50053"
    restart: unless-stopped

  notification-service:
    build:
      context: ./platforma
      dockerfile: services/notification-service/Dockerfile
    container_name: platforma-notification
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      NOTIFICATION_GRPC_PORT: 50054
      KAFKA_BROKER: kafka:9092
      NOTIFICATION_DB_PATH: /app/data/notification-rxdb
    volumes:
      - notification-data:/app/data
    expose:
      - "50054"
    restart: unless-stopped

  api-gateway:
    build:
      context: ./platforma
      dockerfile: api-gateway/Dockerfile
    container_name: platforma-gateway
    depends_on:
      - auth-service
      - booking-service
      - payment-service
      - notification-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-platforma-secret-change-in-prod}
      AUTH_SERVICE_URL: auth-service:50051
      BOOKING_SERVICE_URL: booking-service:50052
      PAYMENT_SERVICE_URL: payment-service:50053
      NOTIFICATION_SERVICE_URL: notification-service:50054
    restart: unless-stopped

volumes:
  auth-data:
  booking-data:
  payment-data:
  notification-data:
